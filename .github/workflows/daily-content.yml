name: Daily Content Generation

on:
  schedule:
    # Runs at 11:00 UTC every day (7am ET / 4:30pm IST / 1pm Madrid)
    - cron: "0 11 * * *"
  workflow_dispatch: # also allow manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-content.mjs

      - name: Verify no duplicate reference images
        run: node scripts/check-images.mjs

      - name: Commit and push new content
        run: |
          git config user.name "Simily Bot"
          git config user.email "bot@simily.org"
          git add app/lib/articles.ts app/lib/best.ts app/lib/news.ts public/article-images
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily content — $(date +'%Y-%m-%d')"
          git push

      - name: Submit new URLs to Google Indexing API
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: node scripts/submit-to-google.mjs /articles /news
